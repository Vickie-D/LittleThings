name: little_things_game
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.35.1
  flame_tiled: ^3.0.9


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tiles/
    - assets/images/tilesets/
    - assets/images/character/
    - assets/images/character/Caveman/
    - assets/images/character/Master/
    - assets/images/character/Boy/
    - assets/images/character/Bunny/
    - assets/images/character/Frog/
    - assets/images/character/Sword/
    - assets/images/enemy/Warrior/
    - assets/images/enemy/Slime/
    - assets/images/dialog/
    - assets/images/items/
    - assets/images/items/Stick/
    - assets/images/items/Pickaxe/
    - assets/images/items/Sword/
    - assets/images/items/Rock/
